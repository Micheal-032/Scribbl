<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Version History | Scribbl</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="static/css/history.css">
  <link rel="stylesheet" href="static/css/theme.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Chart.js for statistics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="history-page">
  <!-- Animated Background -->
  <div class="history-bg-animation">
    <div class="timeline-particles"></div>
    <div class="history-shape shape-1"></div>
    <div class="history-shape shape-2"></div>
    <div class="history-shape shape-3"></div>
  </div>

  <!-- Header -->
  <header class="history-header">
    <div class="header-content">
      <div class="back-nav">
        <a href="dashboard.html" class="back-btn">
          <i class="fas fa-arrow-left"></i>
          <span>Back to Dashboard</span>
        </a>
      </div>
      <div class="header-title">
        <h1><i class="fas fa-history"></i> Version History</h1>
        <p>Track changes and restore previous versions of your notes</p>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="historySearch" placeholder="Search history...">
        </div>
        <button class="export-btn" id="exportHistory">
          <i class="fas fa-download"></i>
          Export
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="history-main">
    <div class="history-container">
      <!-- Statistics Panel -->
      <section class="stats-panel">
        <div class="stat-card">
          <div class="stat-icon">
            <i class="fas fa-clock-rotate-left"></i>
          </div>
          <div class="stat-info">
            <h3 id="totalVersions">0</h3>
            <p>Total Versions</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <i class="fas fa-file-pen"></i>
          </div>
          <div class="stat-info">
            <h3 id="editedNotes">0</h3>
            <p>Edited Notes</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <i class="fas fa-calendar-day"></i>
          </div>
          <div class="stat-info">
            <h3 id="todayEdits">0</h3>
            <p>Today's Edits</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <i class="fas fa-arrows-rotate"></i>
          </div>
          <div class="stat-info">
            <h3 id="restoredCount">0</h3>
            <p>Restored Versions</p>
          </div>
        </div>
      </section>

      <!-- Filters & Controls -->
      <section class="controls-panel">
        <div class="filter-group">
          <label for="dateFilter">Date Range:</label>
          <select id="dateFilter">
            <option value="all">All Time</option>
            <option value="today">Today</option>
            <option value="week">Past Week</option>
            <option value="month">Past Month</option>
            <option value="custom">Custom Range</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="noteFilter">Filter by Note:</label>
          <select id="noteFilter">
            <option value="all">All Notes</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="sortBy">Sort By:</label>
          <select id="sortBy">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="title">Note Title</option>
          </select>
        </div>
        <button class="bulk-compare-btn" id="bulkCompare">
          <i class="fas fa-layer-group"></i>
          Compare Versions
        </button>
      </section>

      <!-- Timeline View -->
      <section class="timeline-section">
        <div class="section-header">
          <h2><i class="fas fa-timeline"></i> Version Timeline</h2>
          <div class="view-toggle">
            <button class="view-btn active" data-view="timeline">
              <i class="fas fa-timeline"></i> Timeline
            </button>
            <button class="view-btn" data-view="list">
              <i class="fas fa-list"></i> List
            </button>
            <button class="view-btn" data-view="stats">
              <i class="fas fa-chart-bar"></i> Statistics
            </button>
          </div>
        </div>

        <div class="timeline-view active" id="timelineView">
          <div class="timeline-container">
            <!-- Timeline will be populated by JavaScript -->
          </div>
        </div>

        <div class="list-view" id="listView">
          <div class="versions-list">
            <!-- List will be populated by JavaScript -->
          </div>
        </div>

        <div class="stats-view" id="statsView">
          <div class="charts-container">
            <div class="chart-card">
              <h3>Edits Over Time</h3>
              <canvas id="editsChart"></canvas>
            </div>
            <div class="chart-card">
              <h3>Most Edited Notes</h3>
              <canvas id="notesChart"></canvas>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Modals Container -->
  <div id="modalsContainer"></div>

  <!-- Scripts -->
  <script src="static/js/dataManager.js"></script>
  <script src="static/js/history.js"></script>
</body>
</html>
